# ESPHome package for the Omlet Smart Automatic Chicken Coop Door control panel (board X107).
#
# Use it from your own config:
#
#   packages:
#     omlet: github://swoboda1337/omlet-esphome/omlet-door.yaml@main
#
# Override any of the substitutions below in your own config to tune the door.

substitutions:
  door_name: Door
  # Set to "true" if "open" drives the door the wrong way.
  invert_direction: "false"
  # The stock firmware reads the crush switch active-low (external pull-up); set
  # to "false" if your board reads it the other way.
  crush_inverted: "true"
  max_duration: 30s
  start_sensing_delay: 300ms
  stall_time: 100ms
  stall_ratio: "2.0"
  max_crush_retries: "3"
  crush_retry_delay: 10s
  lcd_contrast: "22"
  # How often to sample the light sensor and battery.
  sensor_interval: 60s
  # Battery divider ratio is not known yet; measure once and set it so the
  # reported value matches the real pack voltage.
  battery_multiplier: "1.0"
  # How long a front button must be held to count as a long press.
  long_press: 1s
  # Leave the LCD menu and switch the backlight off after this many seconds
  # without a button press or door movement.
  menu_timeout: "30"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source: github://swoboda1337/omlet-esphome
    components: [omlet_door, lcd_st7032]
    refresh: 1h

debug:

i2c:
  sda: GPIO5
  scl: GPIO4
  frequency: 100kHz

output:
  - platform: gpio
    id: omlet_coop_light_output
    pin: GPIO8

  # Power gates for the analogue sensors; raised only while sampling.
  - platform: gpio
    id: omlet_light_sensor_enable
    pin:
      number: GPIO2
      inverted: true

  - platform: gpio
    id: omlet_battery_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true

light:
  - platform: binary
    id: omlet_coop_light
    name: Coop Light
    output: omlet_coop_light_output

sensor:
  # Motor current from the shunt amplifier; only enabled while the door moves.
  - platform: adc
    id: omlet_motor_current
    pin: GPIO9
    attenuation: 12db
    update_interval: never
    internal: true

  - platform: adc
    id: omlet_light_level
    name: Light Level
    pin: GPIO1
    attenuation: 12db
    samples: 16
    update_interval: never
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:brightness-6
    filters:
      - lambda: |-
          // Same scale as the stock firmware: 12-bit counts / 4 minus a dark
          // offset, slope halved above 50, so 100 % is reached at about 0.46 V.
          float level = x * 4095.0f / 3.1f / 4.0f - 3.0f;
          if (level > 50.0f) {
            level = 50.0f + (level - 50.0f) / 2.0f;
          }
          return std::clamp(level, 0.0f, 100.0f);
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: adc
    id: omlet_battery_voltage
    name: Battery Voltage
    pin:
      number: GPIO3
      ignore_strapping_warning: true
    attenuation: 12db
    update_interval: never
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    filters:
      - multiply: ${battery_multiplier}

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(omlet_coop_door)->current_operation != COVER_OPERATION_IDLE) {
            id(omlet_menu_touch) = millis();
            if (!id(omlet_backlight).state) {
              id(omlet_backlight).turn_on();
            }
          }
          if (millis() - id(omlet_menu_touch) > id(omlet_menu_timeout_ms)) {
            if (id(omlet_menu).is_active()) {
              id(omlet_menu).hide();
            }
            if (id(omlet_backlight).state) {
              id(omlet_backlight).turn_off();
            }
          }

  - interval: ${sensor_interval}
    then:
      - output.turn_on: omlet_light_sensor_enable
      - output.turn_on: omlet_battery_enable
      - delay: 1s
      - component.update: omlet_light_level
      - component.update: omlet_battery_voltage
      - output.turn_off: omlet_light_sensor_enable
      - output.turn_off: omlet_battery_enable

binary_sensor:
  - platform: gpio
    id: omlet_crush_switch
    name: Crush Switch
    pin:
      number: GPIO40
      mode: input
      inverted: ${crush_inverted}
      allow_other_uses: true
    device_class: problem

  - platform: template
    id: omlet_door_fault
    name: Door Fault
    device_class: problem
    lambda: return id(omlet_coop_door).has_fault();

  - platform: gpio
    id: omlet_mains_power
    name: Mains Power
    pin:
      number: GPIO48
      mode: input
    device_class: power

  # Front buttons: up, down, OK (same roles as the stock firmware). The board
  # has external pull-downs and the buttons pull the pins high. Short presses drive the menu; at the home screen up toggles the
  # light, down stops the door, and holding OK opens or closes the door.
  - platform: gpio
    id: omlet_button_up
    name: Button Up
    pin:
      number: GPIO21
      mode: input
    internal: true
    on_press:
      - logger.log: "Button Up pressed"
      - lambda: id(omlet_menu_touch) = millis();
      - switch.turn_on: omlet_backlight
    on_release:
      - logger.log: "Button Up released"
    on_multi_click:
      - timing:
          - ON for at most ${long_press}
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(omlet_menu_touch) = millis();
              if (id(omlet_menu).is_active()) {
                id(omlet_menu).up();
              } else {
                id(omlet_coop_light).toggle().perform();
              }
      - timing:
          - ON for at least ${long_press}
        then:
          - lambda: |-
              id(omlet_menu_touch) = millis();
              if (!id(omlet_menu).is_active()) {
                id(omlet_coop_door).make_call().set_command_open().perform();
              }

  - platform: gpio
    id: omlet_button_down
    name: Button Down
    pin:
      number: GPIO17
      mode: input
    internal: true
    on_press:
      - logger.log: "Button Down pressed"
      - lambda: id(omlet_menu_touch) = millis();
      - switch.turn_on: omlet_backlight
    on_release:
      - logger.log: "Button Down released"
    on_multi_click:
      - timing:
          - ON for at most ${long_press}
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(omlet_menu_touch) = millis();
              if (id(omlet_menu).is_active()) {
                id(omlet_menu).down();
              } else {
                id(omlet_coop_door).make_call().set_command_stop().perform();
              }
      - timing:
          - ON for at least ${long_press}
        then:
          - lambda: |-
              id(omlet_menu_touch) = millis();
              if (!id(omlet_menu).is_active()) {
                id(omlet_coop_door).make_call().set_command_close().perform();
              }

  - platform: gpio
    id: omlet_button_ok
    name: Button OK
    pin:
      number: GPIO18
      mode: input
    internal: true
    on_press:
      - logger.log: "Button OK pressed"
      - lambda: id(omlet_menu_touch) = millis();
      - switch.turn_on: omlet_backlight
    on_release:
      - logger.log: "Button OK released"
    on_multi_click:
      - timing:
          - ON for at most ${long_press}
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(omlet_menu_touch) = millis();
              if (id(omlet_menu).is_active()) {
                id(omlet_menu).enter();
              } else {
                id(omlet_menu).show();
              }
      - timing:
          - ON for at least ${long_press}
        then:
          - lambda: |-
              id(omlet_menu_touch) = millis();
              if (id(omlet_menu).is_active()) {
                id(omlet_menu).hide();
              } else {
                auto call = id(omlet_coop_door).make_call();
                if (id(omlet_coop_door).is_fully_open()) {
                  call.set_command_close();
                } else {
                  call.set_command_open();
                }
                call.perform();
              }

cover:
  - platform: omlet_door
    id: omlet_coop_door
    name: ${door_name}
    high_side_a: GPIO11
    low_side_a: GPIO14
    high_side_b: GPIO13
    low_side_b: GPIO12
    current_sampler: omlet_motor_current
    current_enable_pin:
      number: GPIO45
      ignore_strapping_warning: true
    crush_pin:
      number: GPIO40
      mode: input
      inverted: ${crush_inverted}
      allow_other_uses: true
    invert_direction: ${invert_direction}
    max_duration: ${max_duration}
    start_sensing_delay: ${start_sensing_delay}
    stall_time: ${stall_time}
    stall_ratio: ${stall_ratio}
    max_crush_retries: ${max_crush_retries}
    crush_retry_delay: ${crush_retry_delay}

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
      entity_category: diagnostic

button:
  - platform: template
    id: omlet_calibrate
    name: Calibrate Door
    entity_category: config
    on_press:
      - omlet_door.calibrate: omlet_coop_door

switch:
  - platform: template
    id: omlet_backlight
    name: LCD Backlight
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: |-
          id(omlet_menu_touch) = millis();
          id(omlet_lcd).backlight();
    turn_off_action:
      - lambda: id(omlet_lcd).no_backlight();

display:
  - platform: lcd_st7032
    id: omlet_lcd
    dimensions: 16x2
    address: 0x3E
    enable_pin:
      number: GPIO7
      inverted: true
    reset_pin: GPIO6
    backlight_pin:
      number: GPIO47
      inverted: true
    contrast: ${lcd_contrast}
    update_interval: 1s
    lambda: |-
      if (id(omlet_menu).is_active()) {
        id(omlet_menu).draw();
        return;
      }
      auto *door = id(omlet_coop_door);
      if (door->has_fault()) {
        it.print(0, 0, "Door Fault");
      } else if (door->current_operation == COVER_OPERATION_OPENING) {
        it.print(0, 0, "Opening..");
      } else if (door->current_operation == COVER_OPERATION_CLOSING) {
        it.print(0, 0, "Closing..");
      } else if (door->is_fully_open()) {
        it.print(0, 0, "Open");
      } else if (door->is_fully_closed()) {
        it.print(0, 0, "Closed");
      } else {
        it.printf(0, 0, "Door %.0f%%", door->position * 100);
      }
      if (door->has_fault()) {
        it.print(0, 1, "Hold OK to retry");
      } else if (door->current_operation != COVER_OPERATION_IDLE) {
        it.print(0, 1, "Down to stop");
      } else if (door->is_fully_open()) {
        it.print(0, 1, "Hold OK to close");
      } else {
        it.print(0, 1, "Hold OK to open");
      }

time:
  - platform: sntp
    id: omlet_time

globals:
  - id: omlet_menu_touch
    type: uint32_t
    initial_value: "0"
  - id: omlet_menu_timeout_ms
    type: uint32_t
    initial_value: "${menu_timeout} * 1000UL"

lcd_menu:
  id: omlet_menu
  display_id: omlet_lcd
  active: false
  mode: rotary
  mark_submenu: 0x20
  mark_back: 0x3C
  items:
    - type: label
      text: !lambda |-
        auto now = id(omlet_time).now();
        if (!now.is_valid()) {
          return std::string("Time --:--");
        }
        return str_sprintf("Time %02u:%02u", now.hour, now.minute);
    - type: label
      text: !lambda |-
        return str_sprintf("Light %.0f%%", id(omlet_light_level).state);
    - type: label
      text: !lambda |-
        return str_sprintf("Battery %.2f", id(omlet_battery_voltage).state);
    - type: label
      text: !lambda |-
        return std::string(wifi::global_wifi_component->is_connected() ? "Wifi Connected" : "Wifi Not Connected");
    - type: menu
      text: Calibrate
      items:
        - type: command
          text: Start
          on_value:
            - display_menu.hide: omlet_menu
            - omlet_door.calibrate: omlet_coop_door
        - type: back
          text: Back
    - type: command
      text: Exit
      on_value:
        - display_menu.hide: omlet_menu
